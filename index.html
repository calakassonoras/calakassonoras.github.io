<html>

<head>
    <title>Calakas Sonoras</title>
    <style>
        html {
            background: #111111 url(resources/VivaMKE_photos/Calakas_Yoana_Trumpet_Darkened.png) no-repeat center center fixed;
            background-size: cover;
            height: 100%;
            overflow: hidden;
        }

        .large-img {
            max-width: 30%;
            height: auto;
        }

        .img-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            z-index: -1;
            top: 10%;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
        }

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .header {
            /*   background-color: white; 
   border-bottom: solid; */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            font-size: x-large;
        }

        .navbar {
            display: flex;
            width: 100%;
            justify-content: space-evenly;
        }

        .navbar ul {
            display: flex;
            justify-content: space-evenly;
            width: 100%;
        }

        .navbar ul li {
            list-style-type: none;
            display: inline;
            margin-right: 10px;
        }

        .navbar ul li a {
            font-family: 'Trebuchet MS', sans-serif;
            color: white;
            text-decoration: none;
        }

        .navbar ul li a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <ul>
                <li><a href="./">HOME</a></li>
                <li><a href="./about">ABOUT</a></li>
                <li><a href="./gallery">GALLERY</a></li>
                <!-- <li><a href="./">MERCH</a></li> -->
                <li><a href="mailto:booking@calakassonoras.com">BOOKING</a></li>
                <li><a href="https://instagram.com/calakas_sonoras" target="_blank">INSTAGRAM</a></li>
        </nav>
    </header>
    <div class="img-container">
        <img class="large-img" src="resources/calakas-logo-bad-text.png" />
    </div>
</body>

</html>
