<html>

<head>
    <title>Calakas Sonoras — Gallery</title>
    <meta name="title" content="Calakas Sonoras — Gallery" />
    <meta property="twitter:title" content="Calakas Sonoras — Gallery" />
    <meta property="og:title" content="Calakas Sonoras — Gallery" />
    <meta property="og:url" content="https://calakassonoras.com/gallery" />
    <meta property="twitter:url" content="https://calakassonoras.com/gallery" />
    <meta property="og:type" content="website" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:image" content="https://calakassonoras.com/resources/Anniversary_photos/IMG_1122.JPG" />    
    <meta property="og:image" content="https://calakassonoras.com/resources/Anniversary_photos/IMG_1122.JPG" />
    <meta name="description" content='Calakas Sonoras photo gallery' />
    <meta property="twitter:description" content='Calakas Sonoras photo gallery' />
    <meta property="og:description" content='Calakas Sonoras photo gallery' />
    <style>
        html {
            background: url(resources/Anniversary_photos/crowd-fans-bg.jpg) no-repeat center center fixed;
            background-size: cover;
            height: 100%;
            overflow: hidden;
        }

        .large-img {
            aspect-ratio: 16/9;
            object-fit: scale-down;
            max-width: 70%;
            height: auto;
        }

        .button {
            height: 50px;
            width: 50px;
            cursor: pointer;
        }

        .img-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            z-index: 0;
            top: 10%;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
        }

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .header {
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            font-size: x-large;
        }

        .navbar {
            display: flex;
            width: 100%;
            justify-content: space-evenly;
        }

        .navbar ul {
            display: flex;
            justify-content: space-evenly;
            width: 100%;
        }

        .navbar ul li {
            list-style-type: none;
            display: inline;
            margin-right: 10px;
        }

        .navbar ul li a {
            font-family: 'Trebuchet MS', sans-serif;
            color: white;
            text-decoration: none;
        }

        .navbar ul li a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <ul>
                <li><a href="./">HOME</a></li>
                <li><a href="./about">ABOUT</a></li>
                <li><a href="./gallery">GALLERY</a></li>
                <!-- <li><a href="./">MERCH</a></li> -->
                <li><a href="./contact">CONTACT</a></li>
        </nav>
    </header>
    <button></button>
    <div class="img-container">
        <img id="gallery-left" class="button"
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke-width='1.5' stroke='white' class='size-6'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' d='M15.75 19.5 8.25 12l7.5-7.5' /%3E%3C/svg%3E%0A" />
	<!-- WARNING: REMEMBER to edit the source of this to also be the first item in the gallery =) -->
        <img id="gallery-image" class="large-img" src="resources/Anniversary_photos/Yoanna_Rafa.JPG" />
        <img id="gallery-right" class="button"
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke-width='1.5' stroke='white' class='size-6'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' d='m8.25 4.5 7.5 7.5-7.5 7.5' /%3E%3C/svg%3E%0A" />
    </div>
    <script>
        const GALLERY_IMAGES = [
	    "resources/Anniversary_photos/Yoanna_Rafa.JPG",
	    "resources/Fates_Aligned_Tattoo_08_26_photos/Fisheye_Yoana_Rafa_Hard_Epic_Photo_colorgrading_LimeScooterTakeoverMKE.jpg",
	    "resources/Fates_Aligned_Tattoo_08_26_photos/Trent_playing.jpg",
	    "resources/VivaMKE_photos/Calakas_merch_Nata.jpg",
	    "resources/VivaMKE_photos/Calakas_GoofyAhhJesus_Nata.jpg",
	    "resources/Fates_Aligned_Tattoo_08_26_photos/Rafa_throte.jpg",
	    "resources/Anniversary_photos/IMG_1106.JPG",
	    "resources/Fates_Aligned_Tattoo_08_26_photos/Rafa_Yoanna_Alsotrentinthebgmakingface.jpg",
	    "resources/Anniversary_photos/IMG_1117.JPG",
	    "resources/Anniversary_photos/IMG_1110.JPG",
	    "resources/Fates_Aligned_Tattoo_08_26_photos/Jesus_stoic.jpg",
	    "resources/Fates_Aligned_Tattoo_08_26_photos/Yoana_dance.jpg",
	    "resources/Anniversary_photos/IMG_1120.JPG",
	    "resources/Fates_Aligned_Tattoo_08_26_photos/Calakas_Pulpa.jpg",
	    "resources/Anniversary_photos/IMG_1096.JPG",
	    "resources/Fates_Aligned_Tattoo_08_26_photos/Rafa_headless_guitar.jpg",
	    "resources/Fates_Aligned_Tattoo_08_26_photos/Yoana_sing.jpg",
	    "resources/Anniversary_photos/IMG_1105.JPG",
	    "resources/Fates_Aligned_Tattoo_08_26_photos/Calakas_Rafa.jpg",
	    "resources/VivaMKE_photos/Calakas_Band_Kid_Photographer.jpg",
	    "resources/VivaMKE_photos/Calakas_Yoana_Trumpet.jpg",
	    "resources/Anniversary_photos/IMG_1113.JPG",
	    "resources/Anniversary_photos/IMG_1122.JPG",
	    "resources/VivaMKE_photos/Calakas_Jesus_Nata_Fisheye_Band.jpg",
	    "resources/Fates_Aligned_Tattoo_08_26_photos/Andy_Playing.jpg",
	    "resources/Anniversary_photos/IMG_1118.JPG",
            "resources/calakas-logo-bad.png",
        ];

        let CURRENT_IMAGE_INDEX = 0;
        
        document.getElementById("gallery-left").addEventListener("click", () => {
            CURRENT_IMAGE_INDEX = (GALLERY_IMAGES.length + (CURRENT_IMAGE_INDEX - 1)) % GALLERY_IMAGES.length;
            document.getElementById("gallery-image").src = GALLERY_IMAGES[CURRENT_IMAGE_INDEX];
        });

        document.getElementById("gallery-right").addEventListener("click", () => {
            CURRENT_IMAGE_INDEX = (CURRENT_IMAGE_INDEX + 1) % GALLERY_IMAGES.length;
            document.getElementById("gallery-image").src = GALLERY_IMAGES[CURRENT_IMAGE_INDEX];
        });
    </script>
</body>

</html>
